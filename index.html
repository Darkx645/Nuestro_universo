<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NUESTRO UNIVERSO</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght=200;300;400;600&family=Cormorant+Garamond:ital,wght=1,300&display=swap" rel="stylesheet">
    
    <style>
        /* Estilos base */
        body { margin: 0; overflow: hidden; background-color: #030102; font-family: 'Montserrat', sans-serif; color: white; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; display: none; opacity: 0; transition: opacity 1.2s ease-in-out; }
        
        /* Pantalla Inicio */
        #intro-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #030102; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; }
        
        /* Modal Login */
        #login-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-box { background: #111; padding: 30px; border-radius: 15px; border: 1px solid #ffb3c6; text-align: center; }
        input { display: block; margin: 10px auto; padding: 12px; width: 250px; background: #222; border: 1px solid #444; color: white; border-radius: 5px; }
        button { padding: 12px 30px; cursor: pointer; background: transparent; border: 1px solid #ffb3c6; color: #ffb3c6; border-radius: 20px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="intro-screen">
        <h1 style="font-family: 'Cormorant Garamond', serif; color: #ffd1dc;">Lisseth Abigail Quinde Carvajal</h1>
        <div id="contador-amor" style="color: #ffb3c6; margin-bottom: 20px;">
            Llevamos juntos: <span id="tiempo-juntos"></span>
        </div>
        <button id="btn-enter">Felices 4 meses amor mio</button>
    </div>

    <div id="login-modal">
        <div class="modal-box">
            <h2>🔐 Acceso Protegido</h2>
            <input type="email" id="email-field" placeholder="Correo electrónico">
            <input type="password" id="password-field" placeholder="Contraseña">
            <button id="btn-login-confirm">Entrar al Diario</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAWjXELwErrdBqLzfuw8KvR4BhSJaOx3aE",
            authDomain: "recuerdos-8ed7e.firebaseapp.com",
            projectId: "recuerdos-8ed7e",
            storageBucket: "recuerdos-8ed7e.firebasestorage.app",
            messagingSenderId: "1032696494533",
            appId: "1:1032696494533:web:8c5d6710729037379433ac",
            measurementId: "G-1QB6V6VSN4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        setPersistence(auth, browserLocalPersistence);

        const loginModal = document.getElementById('login-modal');
        const btnEnter = document.getElementById('btn-enter');
        const btnLoginConfirm = document.getElementById('btn-login-confirm');
        const introScreen = document.getElementById('intro-screen');
        const container = document.getElementById('canvas-container');

        function ejecutarEntrada() {
        console.log("Intentando entrar al universo..."); // Esto aparecerá en la consola (F12)
        
        const introScreen = document.getElementById('intro-screen');
        const container = document.getElementById('canvas-container');
        
        if (introScreen) introScreen.style.display = 'none';
        if (container) {
            container.style.display = 'block';
            container.style.opacity = '1';
            console.log("Contenedor mostrado.");
        } else {
            console.error("¡ERROR! No se encontró el elemento canvas-container");
        }
    }

        btnEnter.addEventListener('click', () => {
            if (auth.currentUser) {
                ejecutarEntrada();
            } else {
                loginModal.style.display = 'flex';
            }
        });

        btnLoginConfirm.addEventListener('click', async () => {
            const email = document.getElementById('email-field').value;
            const password = document.getElementById('password-field').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                loginModal.style.display = 'none';
                ejecutarEntrada();
            } catch (error) {
                alert("Error de acceso: " + error.message);
            }
        });

        function actualizarContador() {
            const fechaInicio = new Date('2026-01-31T00:00:00');
            const diff = new Date() - fechaInicio;
            const meses = Math.floor(diff / (1000 * 60 * 60 * 24 * 30.44));
            const dias = Math.floor((diff % (1000 * 60 * 60 * 24 * 30.44)) / (1000 * 60 * 60 * 24));
            document.getElementById('tiempo-juntos').innerText = `${meses} meses y ${dias} días`;
        }
        actualizarContador();
    </script>
</body>
</html>
