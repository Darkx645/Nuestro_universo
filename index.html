<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>NUESTRO UNIVERSO</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; color: white; font-family: sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; display: none; }
        #intro-screen { position: fixed; top:0; left:0; width:100%; height:100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; background: #000; }
        #login-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; }
        .modal-box { background: #111; padding: 30px; border-radius: 15px; border: 1px solid #ffd1dc; text-align: center; }
        input { display: block; margin: 10px auto; padding: 10px; width: 250px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="intro-screen">
        <h1>Lisseth Abigail</h1>
        <button id="btn-enter">Entrar al Universo</button>
    </div>

    <div id="login-modal">
        <div class="modal-box">
            <h2>Acceso Protegido</h2>
            <input type="email" id="email-field" placeholder="Correo">
            <input type="password" id="password-field" placeholder="Contraseña">
            <button id="btn-login-confirm">Entrar</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // 1. FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAWjXELwErrdBqLzfuw8KvR4BhSJaOx3aE",
            authDomain: "recuerdos-8ed7e.firebaseapp.com",
            projectId: "recuerdos-8ed7e",
            storageBucket: "recuerdos-8ed7e.firebasestorage.app",
            messagingSenderId: "1032696494533",
            appId: "1:1032696494533:web:8c5d6710729037379433ac",
            measurementId: "G-1QB6V6VSN4"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        setPersistence(auth, browserLocalPersistence);

        // 2. ESCENA 3D
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        
        // Agregar algo para que no esté negro (luz y un cubo de prueba)
        const light = new THREE.AmbientLight(0xffffff); 
        scene.add(light);
        const geometry = new THREE.BoxGeometry();
        const material = new THREE.MeshBasicMaterial({ color: 0xffd1dc });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            cube.rotation.x += 0.01;
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();

        // 3. LÓGICA DE CONTROL
        const loginModal = document.getElementById('login-modal');
        
        document.getElementById('btn-enter').addEventListener('click', () => {
            auth.currentUser ? iniciar() : loginModal.style.display = 'flex';
        });

        document.getElementById('btn-login-confirm').addEventListener('click', async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('email-field').value, document.getElementById('password-field').value);
                loginModal.style.display = 'none';
                iniciar();
            } catch (e) { alert("Error: " + e.message); }
        });

        function iniciar() {
            document.getElementById('intro-screen').style.display = 'none';
            container.style.display = 'block';
        }
    </script>
</body>
</html>
